name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      matrix:
        include:
          - arch: x86_64
            target: x86_64-apple-darwin
          - arch: aarch64
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" ] && \
             [ -n "${{ secrets.APPLE_SIGNING_IDENTITY }}" ] && \
             [ -n "${{ secrets.APPLE_ID }}" ] && \
             [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets not set — DMG will be ad-hoc signed and not notarized."
          fi

      - name: Import signing certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

      - name: Generate app icon
        run: |
          SRC=assets/sprites/mario1.png
          BG="#1a1a2e"
          mkdir -p icon.iconset
          for sz in 16 32 64 128 256 512 1024; do
            magick "$SRC" \
              -filter point -resize "${sz}x${sz}" \
              -background "$BG" -gravity center -extent "${sz}x${sz}" \
              "/tmp/icon-${sz}.png"
          done
          cp /tmp/icon-16.png   icon.iconset/icon_16x16.png
          cp /tmp/icon-32.png   icon.iconset/icon_16x16@2x.png
          cp /tmp/icon-32.png   icon.iconset/icon_32x32.png
          cp /tmp/icon-64.png   icon.iconset/icon_32x32@2x.png
          cp /tmp/icon-128.png  icon.iconset/icon_128x128.png
          cp /tmp/icon-256.png  icon.iconset/icon_128x128@2x.png
          cp /tmp/icon-256.png  icon.iconset/icon_256x256.png
          cp /tmp/icon-512.png  icon.iconset/icon_256x256@2x.png
          cp /tmp/icon-512.png  icon.iconset/icon_512x512.png
          cp /tmp/icon-1024.png icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Build .app bundle
        run: |
          APP=rusty-mario
          ARCH=${{ matrix.arch }}
          BINARY=target/${{ matrix.target }}/release/$APP

          mkdir -p "$APP.app/Contents/MacOS"
          mkdir -p "$APP.app/Contents/Resources"
          cp "$BINARY" "$APP.app/Contents/MacOS/$APP"
          cp -r assets "$APP.app/Contents/Resources/"
          cp icon.icns "$APP.app/Contents/Resources/icon.icns"

          cat > "$APP.app/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>$APP</string>
            <key>CFBundleIconFile</key>
            <string>icon</string>
            <key>CFBundleIdentifier</key>
            <string>com.rustymario.app</string>
            <key>CFBundleName</key>
            <string>Rusty Mario</string>
            <key>CFBundleVersion</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundleShortVersionString</key>
            <string>${{ github.ref_name }}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
          </dict>
          </plist>
          PLIST

      - name: Sign .app bundle
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --deep --force --options runtime \
            --sign "$APPLE_SIGNING_IDENTITY" \
            --entitlements <(cat <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key>
            <true/>
          </dict>
          </plist>
          EOF
          ) \
            rusty-mario.app

      - name: Ad-hoc sign .app bundle
        if: steps.signing.outputs.enabled != 'true'
        run: codesign --deep --force --sign - rusty-mario.app

      - name: Create DMG
        run: |
          hdiutil create -volname "Rusty Mario" -srcfolder rusty-mario.app \
            -ov -format UDZO "rusty-mario-${{ matrix.arch }}.dmg"

      - name: Sign DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" \
            "rusty-mario-${{ matrix.arch }}.dmg"

      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "rusty-mario-${{ matrix.arch }}.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "rusty-mario-${{ matrix.arch }}.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: rusty-mario-${{ matrix.arch }}.dmg

  build-linux:
    name: Linux (x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libudev-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Generate Linux icon
        run: |
          sudo apt-get install -y imagemagick
          magick assets/sprites/mario1.png \
            -filter point -resize 256x256 \
            -background "#1a1a2e" -gravity center -extent 256x256 \
            /tmp/rusty-mario.png

      - name: Package tar.gz
        run: |
          APP=rusty-mario
          DIST=$APP-linux-x86_64
          mkdir -p "$DIST"
          cp target/release/$APP "$DIST/"
          cp -r assets "$DIST/"
          cp /tmp/rusty-mario.png "$DIST/rusty-mario.png"
          cat > "$DIST/rusty-mario.desktop" <<DESKTOP
          [Desktop Entry]
          Type=Application
          Name=Rusty Mario
          Comment=Bevy 0.15 port of Super Mario
          Exec=rusty-mario
          Icon=rusty-mario
          Terminal=false
          Categories=Game;ArcadeGame;
          DESKTOP
          tar -czf "$DIST.tar.gz" "$DIST"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x86_64
          path: rusty-mario-linux-x86_64.tar.gz

  build-windows:
    name: Windows (x86_64)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-x86_64-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Install NSIS and ImageMagick
        run: choco install nsis imagemagick -y

      - name: Generate installer icon
        shell: pwsh
        run: |
          $bg = "#1a1a2e"
          $src = "assets\sprites\mario1.png"
          New-Item -ItemType Directory -Force -Path "build\icons" | Out-Null
          foreach ($sz in 16,32,48,64,128,256) {
            & magick $src `
              -filter point -resize "${sz}x${sz}" `
              -background $bg -gravity center -extent "${sz}x${sz}" `
              "build\icons\icon-${sz}.png"
          }
          & magick build\icons\icon-256.png build\icons\icon-128.png build\icons\icon-64.png `
                   build\icons\icon-48.png  build\icons\icon-32.png  build\icons\icon-16.png `
                   "installer\icon.ico"

      - name: Build installer
        shell: pwsh
        run: |
          # Stage files next to the .nsi script so File directives resolve
          Copy-Item "target\release\rusty-mario.exe" "installer\"
          Copy-Item -Recurse assets "installer\"
          & "C:\Program Files (x86)\NSIS\makensis.exe" installer\windows.nsi

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: rusty-mario-windows-x86_64-setup.exe

  build-wasm:
    name: WASM
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.121 --locked

      - name: Install wasm-opt
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen

      - name: Build WASM
        run: bash build_wasm.sh

      - name: Package WASM zip
        run: |
          cd dist
          zip -r ../rusty-mario-wasm.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wasm
          path: rusty-mario-wasm.zip

  release:
    name: Create GitHub Release
    needs: [build-macos, build-linux, build-windows, build-wasm]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: Rusty Mario ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            rusty-mario-x86_64.dmg
            rusty-mario-aarch64.dmg
            rusty-mario-linux-x86_64.tar.gz
            rusty-mario-windows-x86_64-setup.exe
            rusty-mario-wasm.zip
          body: |
            ## Rusty Mario ${{ github.ref_name }}

            A Bevy 0.15 WASM port of Super Mario.

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Apple Silicon) | `rusty-mario-aarch64.dmg` |
            | macOS (Intel) | `rusty-mario-x86_64.dmg` |
            | Linux x86_64 | `rusty-mario-linux-x86_64.tar.gz` |
            | Windows x86_64 | `rusty-mario-windows-x86_64-setup.exe` |
            | Web (WASM) | `rusty-mario-wasm.zip` |
